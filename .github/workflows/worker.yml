name: Cloud Environment Worker

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        $Password = ConvertTo-SecureString "CloudDevice123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password

    - name: Initialize Connection
      run: |
        # Download the official cloudflared binary
        Invoke-WebRequest -Uri "https://github.com" -OutFile "cloudflared.exe"
        
        # Start a quick ad-hoc TCP tunnel pointing to the local RDP port
        Start-Process .\cloudflared.exe -ArgumentList "tunnel --url tcp://localhost:3389" -RedirectStandardError "cf.log" -NoNewWindow
        Start-Sleep -Seconds 15
        
        # Read the error log where cloudflared dumps its initialization URLs
        $LogContent = Get-Content "cf.log" -Raw
        Write-Host "=========================================="
        Write-Host "         CLOUDFLARE LOG OUTPUT            "
        Write-Host "=========================================="
        Write-Host $LogContent
        Write-Host "=========================================="
        
    - name: Execution Cycle (6 Hours)
      run: |
        for ($i=1; $i -le 350; $i++) {
            Write-Host "Session Keep-Alive: Minute $i / 350"
            Start-Sleep -Seconds 60
        }
