name: Cloud Environment Worker

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        $Password = ConvertTo-SecureString "CloudDevice123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password

    - name: Initialize Connection
      run: |
        # 1. Start a background SSH tunnel using localhost.run targeting your RDP port (3389)
        Start-Process ssh -ArgumentList "-o StrictHostKeyChecking=no -R 80:localhost:3389 tunnel.us.localhost.run" -RedirectStandardOutput "tunnel.log" -NoNewWindow
        
        # 2. Give the tunnel 10 seconds to generate the public routing link
        Start-Sleep -Seconds 10
        
        # 3. Read the log file to extract the public domain string
        $LogContent = Get-Content "tunnel.log" -Raw
        
        # 4. Use a regular expression to find the exact address text inside the log
        if ($LogContent -match "([a-zA-Z0-9-]+\.tunnel\.us\.localhost\.run)") {
            $Address = $Matches[0]
            Write-Host "=========================================="
            Write-Host "             TUNNEL ONLINE                "
            Write-Host "=========================================="
            Write-Host "YOUR RDP ADDRESS IS: $Address"
            Write-Host "USERNAME: runneradmin"
            Write-Host "PASSWORD: CloudDevice123!"
            Write-Host "=========================================="
        } else {
            Write-Host "=========================================="
            Write-Host "ERROR: Tunnel link generation delayed."
            Write-Host "Raw Log contents below:"
            Write-Host $LogContent
            Write-Host "=========================================="
        }

    - name: Execution Cycle (6 Hours)
      run: |
        # Loops safely for 5 hours and 50 minutes to keep the cloud machine alive
        for ($i=1; $i -le 350; $i++) {
            Write-Host "Session Keep-Alive: Minute $i / 350"
            Start-Sleep -Seconds 60
        }
