name: Cloud Environment Worker

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Setup Environment
      run: |
        choco install ngrok -y
        
    - name: Authenticate Tunnel
      env:
        NGROK_TOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      run: |
        ngrok config add-authtoken "$env:NGROK_TOKEN"

    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        $Password = ConvertTo-SecureString "CloudDevice123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password

    - name: Initialize Connection
      run: |
        # Use start to explicitly run ngrok with a specific region to prevent silent crashes
        Start-Process ngrok -ArgumentList "tcp 3389 --region=us"
        Start-Sleep -Seconds 15
        
        # Pull API tunnel details safely
        $local_api = "http://127.0.0"
        try {
            $tunnels = Invoke-RestMethod -Uri $local_api -TimeoutSec 10
            $url = $tunnels.tunnels.public_url
            Write-Host "=========================================="
            Write-Host "CONNECT VIA RDP TO: $url"
            Write-Host "USERNAME: runneradmin"
            Write-Host "PASSWORD: CloudDevice123!"
            Write-Host "=========================================="
        } catch {
            Write-Host "Local API did not respond. Trying alternative log scan..."
            ngrok tcp 3389 --log=stdout --region=us &
            Start-Sleep -Seconds 10
        }

    - name: Execution Cycle
      run: |
        for ($i=1; $i -le 350; $i++) {
            Write-Host "Session Keep-Alive: Minute $i / 350"
            Start-Sleep -Seconds 60
        }
