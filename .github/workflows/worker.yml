name: Cloud Environment Worker

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        $Password = ConvertTo-SecureString "CloudDevice123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password

    - name: Initialize Connection
      run: |
        # Pinggy establishes an SSH-backed tunnel without separate client software
        Start-Process ssh -ArgumentList "-o StrictHostKeyChecking=no -p 443 -R0:localhost:3389 tcp@a.pinggy.io" -RedirectStandardOutput "pinggy.log" -NoNewWindow
        Start-Sleep -Seconds 12
        
        # Read the generated URL data from log tracking
        $log = Get-Content "pinggy.log" -Raw
        
        Write-Host "=========================================="
        Write-Host "             TUNNEL STARTED               "
        Write-Host "=========================================="
        Write-Host "LOOK FOR YOUR RDP ADDRESS IN THE LOG LINE BELOW:"
        Write-Host $log
        Write-Host "=========================================="
        Write-Host "USERNAME: runneradmin"
        Write-Host "PASSWORD: CloudDevice123!"
        Write-Host "=========================================="
        
        # Save connection parameters locally
        $log | Out-File -FilePath "connection_info.txt"

    - name: Upload Connection Details
      uses: actions/upload-artifact@v4
      with:
        name: rdp-credentials
        path: connection_info.txt

    - name: Execution Cycle
      run: |
        for ($i=1; $i -le 60; $i++) {
            Write-Host "Session Keep-Alive: Minute $i / 60"
            Start-Sleep -Seconds 60
        }
