name: Cloud Environment Worker

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Setup Environment
      run: |
        choco install ngrok -y
        
    - name: Authenticate Tunnel
      env:
        NGROK_TOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      run: |
        ngrok config add-authtoken "$env:NGROK_TOKEN"

    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        $Password = ConvertTo-SecureString "CloudDevice123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password

    - name: Initialize Connection
      run: |
        # Force a named tunnel configuration to guarantee it binds to your active endpoints
        Start-Process ngrok -ArgumentList "tcp 3389 --region=us"
        Start-Sleep -Seconds 15
        
        $local_api = "http://127.0.0"
        $tunnels = Invoke-RestMethod -Uri $local_api
        $url = $tunnels.tunnels.public_url
        
        # Save the connection details directly into a text file so you don't need the dashboard
        New-Item -Path . -Name "connection_info.txt" -ItemType "file" -Value "RDP ADDRESS: $url `nUSERNAME: runneradmin `nPASSWORD: CloudDevice123!"
        
        Write-Host "=========================================="
        Write-Host "LINK READY - CHECK ARTIFACTS ON THE ACTIONS TAB"
        Write-Host "=========================================="

    - name: Upload Connection Details
      uses: actions/upload-artifact@v4
      with:
        name: rdp-credentials
        path: connection_info.txt

    - name: Execution Cycle
      run: |
        for ($i=1; $i -le 350; $i++) {
            Write-Host "Session Keep-Alive: Minute $i / 350"
            Start-Sleep -Seconds 60
        }
