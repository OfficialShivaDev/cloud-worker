name: Cloud Environment Worker

on: 
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Setup Environment
      run: |
        choco install ngrok -y
        
    - name: Authenticate Tunnel
      env:
        NGROK_TOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
      run: |
        # Fixed: Reference environment variable cleanly without conflicting quotes
        ngrok config add-authtoken $env:NGROK_TOKEN

    - name: Enable Remote Desktop
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        $Password = ConvertTo-SecureString "CloudDevice123!" -AsPlainText -Force
        Set-LocalUser -Name "runneradmin" -Password $Password

    - name: Initialize Connection
        run: |
          # Open a TCP tunnel to port 3389 using Pinggy over native SSH
          # It outputs the public address straight to a log file
          Start-Process ssh -ArgumentList "-o StrictHostKeyChecking=no -p 443 -R0:localhost:3389 tcp@a.pinggy.io" -RedirectStandardOutput "pinggy.log" -NoNewWindow
          Start-Sleep -Seconds 10
      
      # Read the log file and find your public RDP address
      $log = Get-Content "pinggy.log" -Raw
      Write-Host "=========================================="
      Write-Host "PINGGY LOG OUTPUT:"
      Write-Host $log
      Write-Host "=========================================="

        
        # Fixed: Correct ngrok local API address and endpoint path
        $local_api = "http://127.0.0"
        $response = Invoke-RestMethod -Uri $local_api
        
        # Fixed: Extracted the specific public URL property from the array
        $url = $response.tunnels[0].public_url
        
        # Format the URL cleanly for RDP client copy-paste (removes 'tcp://')
        $clean_url = $url -replace "tcp://", ""
        
        # Save connection details to text file
        $OutputText = "RDP ADDRESS: $clean_url`r`nUSERNAME: runneradmin`r`nPASSWORD: CloudDevice123!"
        New-Item -Path . -Name "connection_info.txt" -ItemType "file" -Value $OutputText -Force
        
        # Print directly to the action log so you don't even have to wait for the artifact download
        Write-Host "=========================================="
        Write-Host "YOUR RDP ADDRESS IS: $clean_url"
        Write-Host "USERNAME: runneradmin"
        Write-Host "PASSWORD: CloudDevice123!"
        Write-Host "=========================================="

    - name: Upload Connection Details
      uses: actions/upload-artifact@v4
      with:
        name: rdp-credentials
        path: connection_info.txt

    - name: Execution Cycle
      run: |
        for ($i=1; $i -le 350; $i++) {
            Write-Host "Session Keep-Alive: Minute $i / 350"
            Start-Sleep -Seconds 60
        }
